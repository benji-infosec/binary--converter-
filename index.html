<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Binary Converter | EdTech Project</title>
    <!-- Link to external stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h2>Interactive 8-Bit Binary Converter</h2>
        <p>Click the buttons below to toggle bits (0 or 1) and see how binary numbers translate into decimal values!</p>
        
        <!-- The container where JavaScript will dynamically inject the bit buttons -->
        <div class="bits-container" id="bitsContainer"></div>

        <!-- Real-time result display -->
        <div class="result">
            Decimal Value: <span id="decimalOutput">0</span>
        </div>
    </div>

    <!-- Link to external JavaScript logic -->
    <script src="app.js"></script>
</body>
</html>
